<style>
:root {
  --bg: #0a0a0f;

* { margin:0; padding:0; box-sizing:border-box; }
body {

  color: var(--text);
  font-family: 'SF Mono', 'Fira Code', monospace;
  min-height: 100vh;
  overflow-x: hidden;

#bg-canvas {
  position: fixed; top:0; left:0; width:100%; height:100%;

}

  position: relative; z-index: 1;
  max-width: 1400px; margin: 0 auto; padding: 2rem;
}
header {
  text-align: center; padding: 3rem 0 2rem;
  border-bottom: 1px solid var(--border); margin-bottom: 2rem;
}
header h1 {
  font-size: 2.5rem;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.5rem;
}
header p { color: var(--text-dim); font-size: 0.9rem; }
.stats {
  display: flex; gap: 1rem; justify-content: center;
  margin: 1.5rem 0; flex-wrap: wrap;
}
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 8px; padding: 0.8rem 1.5rem;
  text-align: center; min-width: 120px;
}
.stat-card .num {
  font-size: 1.8rem; font-weight: bold;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-card .label { color: var(--text-dim); font-size: 0.75rem; }
.controls {
  display: flex; gap: 0.5rem; justify-content: center;
  margin: 1.5rem 0; flex-wrap: wrap;
}
.controls input[type="text"] {
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text); padding: 0.6rem 1rem;
  border-radius: 6px; width: 300px; font-family: inherit;
  font-size: 0.9rem;
}
.controls input[type="text"]::placeholder { color: var(--text-dim); }
.controls button, .controls select {
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text); padding: 0.6rem 1rem;
  border-radius: 6px; cursor: pointer; font-family: inherit;
  font-size: 0.85rem; transition: all 0.2s;
}
.controls button:hover, .controls select:hover {
  border-color: var(--accent);
}
.controls button.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.filter-tags {
  display: flex; gap: 0.4rem; justify-content: center;
  margin: 1rem 0 2rem; flex-wrap: wrap;
}
.filter-tag {
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-dim); padding: 0.3rem 0.8rem;
  border-radius: 20px; font-size: 0.75rem; cursor: pointer;
  transition: all 0.2s;
}
.filter-tag:hover, .filter-tag.active {
  border-color: var(--accent);
  color: var(--accent);
}
.view-toggle {
  display: flex; gap: 0.5rem; margin-left: 1rem;
}
.view-toggle button.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
}
.project-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 8px; padding: 1rem;
  transition: all 0.3s;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.project-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(108, 92, 231, 0.15);
}
.project-card .card-header {
  display: flex; justify-content: space-between; align-items: start;
  margin-bottom: 0.5rem;
}
.project-card .num-badge {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white; padding: 0.15rem 0.5rem;
  border-radius: 4px; font-size: 0.7rem; font-weight: bold;
}
.project-card .cat-badge {
  font-size: 0.7rem; color: var(--accent2);
  background: rgba(0, 206, 201, 0.1);
  padding: 0.15rem 0.5rem; border-radius: 4px;
}
.project-card h3 {
  font-size: 0.9rem; margin: 0.5rem 0;
  color: var(--text);
}
.project-card p {
  font-size: 0.75rem; color: var(--text-dim);
  line-height: 1.4;
}
.project-card .card-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 0.8rem; padding-top: 0.8rem;
  border-top: 1px solid var(--border);
}
.project-card .visit-btn {
  background: var(--accent);
  color: white; padding: 0.3rem 0.8rem;
  border-radius: 4px; font-size: 0.75rem;
  text-decoration: none; transition: all 0.2s;
}
.project-card .visit-btn:hover {
  background: var(--accent2);
}
.timeline {
  max-width: 800px; margin: 0 auto;
}
.timeline-item {
  display: flex; gap: 1.5rem;
  padding: 1.5rem 0;
  border-left: 2px solid var(--border);
  margin-left: 2rem;
  position: relative;
}
.timeline-item::before {
  content: '';
  position: absolute; left: -6px; top: 1.5rem;
  width: 10px; height: 10px;
  background: var(--accent);
  border-radius: 50%;
}
.timeline-item .tl-num {
  color: var(--accent); font-weight: bold;
  min-width: 60px; font-size: 0.9rem;
}
.timeline-item .tl-content h3 {
  font-size: 1rem; margin-bottom: 0.3rem;
}
.timeline-item .tl-content p {
  font-size: 0.85rem; color: var(--text-dim);
  margin-bottom: 0.5rem;
}
.timeline-item .tl-content a {
  color: var(--accent2); font-size: 0.85rem;
}
.no-results {
  text-align: center; padding: 3rem;
  color: var(--text-dim);
}
</style>
</head>

const CATEGORIES = [...new Set(PROJECTS.map(p => p.c))];
const CATEGORY_EMOJI = {};
CATEGORIES.forEach(c => CATEGORY_EMOJI[c] = c.match(/🎨|🎵|⚛️|📊|🧠|✍️|💻|🎮|🏗️|📈|🔒|📡|🌌|⏱️|🚀|🔗|📐|🌐|📺|🏺|💻/)?.[0] || '📦');

let currentView = 'grid';
let activeFilter = '全部';
let searchTerm = '';

function getCategories() {
  const cats = new Set(['全部']);
  PROJECTS.forEach(p => cats.add(p.c));
  return [...cats];
}

function getFilteredProjects() {
  return PROJECTS.filter(p => {
    const matchCat = activeFilter === '全部' || p.c === activeFilter;
    const matchSearch = !searchTerm || p.t.toLowerCase().includes(searchTerm.toLowerCase()) || p.d.toLowerCase().includes(searchTerm.toLowerCase());
    return matchCat && matchSearch;
  });
}

function renderStats() {
  const statsEl = document.getElementById('stats');
  const total = PROJECTS.length;
  const cats = [...new Set(PROJECTS.map(p => p.c))].length;
  statsEl.innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">專案總數</div></div>
    <div class="stat-card"><div class="num">${cats}</div><div class="label">分類數</div></div>
    <div class="stat-card"><div class="num">${Math.max(...PROJECTS.map(p=>p.n))}</div><div class="label">最新編號</div></div>
  `;
}

function renderFilters() {
  const tagsEl = document.getElementById('filterTags');
  const cats = getCategories();
  tagsEl.innerHTML = cats.map(c =>
    `<span class="filter-tag ${activeFilter === c ? 'active' : ''}" onclick="filterByCategory('${c.replace(/'/g, "\\'")}')">${c}</span>`
  ).join('');
}

function renderProjects() {
  const container = document.getElementById('projectsContainer');
  const filtered = getFilteredProjects();
  if (filtered.length === 0) {
    container.className = '';
    container.innerHTML = '<div class="no-results">😅 找不到符合的專案</div>';
    return;
  }
  if (currentView === 'grid') {
    container.className = 'projects-grid';
    container.innerHTML = filtered.map(p => `
      <div class="project-card">
        <div class="card-header">
          <span class="num-badge">#${p.n}</span>
          <span class="cat-badge">${p.c}</span>
        </div>
        <h3>${p.t}</h3>
        <p>${p.d}</p>
        <div class="card-footer">
          <span style="font-size:0.75rem;color:var(--text-dim)">${p.c}</span>
          <a href="https://mavisy75106.github.io/${p.u}/" target="_blank" class="visit-btn">訪問 →</a>
        </div>
      </div>
    `).join('');
  } else {
    container.className = 'timeline';
    const sorted = [...filtered].sort((a,b) => b.n - a.n);
    container.innerHTML = sorted.map(p => `
      <div class="timeline-item">
        <div class="tl-num">#${p.n}</div>
        <div class="tl-content">
          <h3>${p.t}</h3>
          <p>${p.d}</p>
          <a href="https://mavisy75106.github.io/${p.u}/" target="_blank">🔗 訪問專案 →</a>
        </div>
      </div>
    `).join('');
  }
}

function setView(view) {
  currentView = view;
  document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderProjects();
}

function filterByCategory(cat) {
  activeFilter = cat;
  renderFilters();
  renderProjects();
}

document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  renderProjects();
});

// Background particles
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
function initBg() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  particles = [];
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      r: Math.random() * 2 + 0.5
    });
  }
}
function animateBg() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(108, 92, 231, 0.3)';
    ctx.fill();
  });
  // Draw connections
  particles.forEach((a, i) => {
    particles.slice(i+1).forEach(b => {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 150) {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `rgba(108, 92, 231, ${0.1 * (1 - dist/150)})`;
        ctx.stroke();
      }
    });
  });
  requestAnimationFrame(animateBg);
}
window.addEventListener('resize', initBg);
initBg();
animateBg();

// Initial render
renderStats();
renderFilters();
renderProjects();
</script>
