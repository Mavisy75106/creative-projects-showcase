<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Projects — Portfolio Showcase</title>
<style>
:root {
  --bg: #0a0a0f;
  --bg-card: #12121a;
  --bg-card-hover: #1a1a28;
  --border: #2a2a3a;
  --text: #e0e0e8;
  --text-muted: #888898;
  --accent: #6c63ff;
  --accent-glow: rgba(108, 99, 255, 0.15);
  --tag-bg: rgba(108, 99, 255, 0.1);
  --tag-border: rgba(108, 99, 255, 0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background particles */
#bg-canvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}

.container {
  position: relative; z-index: 1;
  max-width: 1400px; margin: 0 auto; padding: 2rem;
}

/* Header */
header {
  text-align: center; padding: 4rem 0 3rem;
  border-bottom: 1px solid var(--border); margin-bottom: 2rem;
}

header h1 {
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

header p {
  color: var(--text-muted); font-size: 1.1rem; margin-top: 0.75rem;
  max-width: 600px; margin-inline: auto;
}

.stats {
  display: flex; justify-content: center; gap: 3rem; margin-top: 2rem; flex-wrap: wrap;
}

.stat { text-align: center; }
.stat-number { font-size: 2.5rem; font-weight: 700; color: var(--accent); }
.stat-label { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem; }

/* Filters */
.filters {
  display: flex; gap: 0.75rem; flex-wrap: wrap;
  justify-content: center; margin-bottom: 2rem;
  align-items: center;
}

.search-box {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; padding: 0.75rem 1.25rem;
  color: var(--text); font-size: 0.95rem; width: 280px;
  outline: none; transition: border-color 0.3s;
}
.search-box:focus { border-color: var(--accent); }
.search-box::placeholder { color: var(--text-muted); }

.filter-btn {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; padding: 0.6rem 1.2rem;
  color: var(--text-muted); font-size: 0.85rem; cursor: pointer;
  transition: all 0.3s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active {
  background: var(--accent-glow); border-color: var(--accent);
  color: var(--accent);
}

/* Project grid */
.project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1.25rem;
}

.project-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer; position: relative; overflow: hidden;
  display: flex; flex-direction: column;
}

.project-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 3px; background: linear-gradient(90deg, var(--accent), #00d4aa);
  opacity: 0; transition: opacity 0.3s;
}

.project-card:hover {
  border-color: var(--accent);
  transform: translateY(-4px);
  box-shadow: 0 20px 60px rgba(108, 99, 255, 0.1);
  background: var(--bg-card-hover);
}
.project-card:hover::before { opacity: 1; }

.project-number {
  font-size: 0.75rem; color: var(--accent); font-weight: 600;
  letter-spacing: 0.1em; margin-bottom: 0.5rem;
}

.project-title {
  font-size: 1.15rem; font-weight: 600; margin-bottom: 0.5rem;
  line-height: 1.3;
}

.project-desc {
  font-size: 0.88rem; color: var(--text-muted); line-height: 1.5;
  flex-grow: 1; margin-bottom: 1rem;
  display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden;
}

.project-tags {
  display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem;
}

.tag {
  font-size: 0.72rem; padding: 0.25rem 0.6rem;
  border-radius: 20px; border: 1px solid var(--tag-border);
  background: var(--tag-bg); color: var(--accent);
  white-space: nowrap;
}

.project-link {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-size: 0.85rem; color: var(--accent);
  text-decoration: none; font-weight: 500;
  transition: gap 0.3s;
}
.project-link:hover { gap: 0.7rem; }

/* Empty state */
.empty-state {
  text-align: center; padding: 4rem 2rem; color: var(--text-muted);
  grid-column: 1 / -1;
}
.empty-state h3 { color: var(--text); margin-bottom: 0.5rem; }

/* Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
  z-index: 100; display: none;
  justify-content: center; align-items: center; padding: 1rem;
}
.modal-overlay.active { display: flex; }

.modal {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 20px; padding: 2.5rem; max-width: 600px;
  width: 100%; max-height: 80vh; overflow-y: auto;
  position: relative;
  animation: modalIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-close {
  position: absolute; top: 1rem; right: 1rem;
  background: none; border: none; color: var(--text-muted);
  font-size: 1.5rem; cursor: pointer;
}

.modal h2 { font-size: 1.4rem; margin-bottom: 0.5rem; }
.modal .modal-num { color: var(--accent); font-size: 0.85rem; margin-bottom: 1rem; }
.modal .modal-desc { color: var(--text-muted); line-height: 1.6; margin-bottom: 1.5rem; }
.modal .modal-features { margin-bottom: 1.5rem; }
.modal .modal-features h3 { font-size: 0.95rem; margin-bottom: 0.75rem; }
.modal .modal-features ul { list-style: none; }
.modal .modal-features li {
  padding: 0.4rem 0; padding-left: 1.2rem; position: relative;
  color: var(--text-muted); font-size: 0.9rem;
}
.modal .modal-features li::before {
  content: '→'; position: absolute; left: 0; color: var(--accent);
}
.modal .modal-actions { display: flex; gap: 1rem; }

.btn-launch {
  display: inline-flex; align-items: center; gap: 0.5rem;
  padding: 0.8rem 1.5rem; border-radius: 12px; border: none;
  font-size: 0.95rem; font-weight: 600; cursor: pointer;
  text-decoration: none; transition: all 0.3s;
}
.btn-launch.primary {
  background: var(--accent); color: #fff;
}
.btn-launch.primary:hover { opacity: 0.85; transform: translateY(-1px); }
.btn-launch.secondary {
  background: var(--bg); color: var(--text-muted);
  border: 1px solid var(--border);
}
.btn-launch.secondary:hover { border-color: var(--accent); color: var(--text); }

/* View toggle */
.view-toggle {
  display: flex; gap: 0.5rem; justify-content: flex-end; margin-bottom: 1rem;
}
.view-btn {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 8px; padding: 0.5rem 0.8rem; color: var(--text-muted);
  cursor: pointer; font-size: 0.8rem; transition: all 0.3s;
}
.view-btn.active { color: var(--accent); border-color: var(--accent); }

/* Timeline view */
.timeline-view { display: none; }
.timeline-view.active { display: block; }
.timeline-item {
  display: flex; gap: 1.5rem; padding: 1.5rem; margin-bottom: 1rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; transition: all 0.3s; cursor: pointer;
}
.timeline-item:hover { border-color: var(--accent); }
.timeline-date {
  font-size: 0.8rem; color: var(--text-muted); min-width: 90px;
  padding-top: 0.3rem;
}
.timeline-content { flex: 1; }
.timeline-title { font-weight: 600; font-size: 1rem; margin-bottom: 0.25rem; }
.timeline-meta { font-size: 0.82rem; color: var(--text-muted); }

.grid-view { display: block; }
.grid-view.hidden { display: none; }

@media (max-width: 768px) {
  .container { padding: 1rem; }
  header { padding: 2rem 0; }
  .project-grid { grid-template-columns: 1fr; }
  .stats { gap: 1.5rem; }
  .filters { flex-direction: column; align-items: stretch; }
  .search-box { width: 100%; }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container">
  <header>
    <h1>Creative Projects</h1>
    <p>A collection of interactive visualizations and creative tools — built one trending idea at a time.</p>
    <div class="stats">
      <div class="stat"><div class="stat-number" id="total-count">0</div><div class="stat-label">Projects</div></div>
      <div class="stat"><div class="stat-number" id="deployed-count">0</div><div class="stat-label">Deployed</div></div>
      <div class="stat"><div class="stat-number" id="categories-count">0</div><div class="stat-label">Categories</div></div>
    </div>
  </header>

  <div class="filters">
    <input type="text" class="search-box" id="search" placeholder="Search projects...">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="ai-agent">AI Agent</button>
    <button class="filter-btn" data-filter="visualization">Visualization</button>
    <button class="filter-btn" data-filter="cli">CLI / Tool</button>
    <button class="filter-btn" data-filter="security">Security</button>
    <button class="filter-btn" data-filter="space">Space</button>
    <button class="filter-btn" data-filter="creative">Creative</button>
  </div>

  <div class="view-toggle">
    <button class="view-btn active" data-view="grid">Grid</button>
    <button class="view-btn" data-view="timeline">Timeline</button>
  </div>

  <div id="grid-view" class="project-grid"></div>
  <div id="timeline-view" class="timeline-view"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" id="modal-close">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const projects = [
  { number: 34, title: "Agent Skill Tree", desc: "Interactive visualization of AI agent capabilities as a skill tree — explore what agents can do.", tags: ["ai-agent", "visualization"], url: "https://Mavisy75106.github.io/creative-project-40/", date: "2026-05-20" },
  { number: 35, title: "AI Agent Ecosystem Explorer", desc: "Multi-mode visualization of AI agent ecosystems with chaos slider, memory flow, and conversation particles.", tags: ["ai-agent", "visualization"], url: "https://mavisy75106.github.io/creative-project-41/", date: "2026-05-20" },
  { number: 36, title: "Neural Canvas — Sana Diffusion Simulator", desc: "Sana diffusion model simulator with particle convergence, attention heatmap, and latent token visualization.", tags: ["ai-agent", "creative"], url: "https://mavisy75106.github.io/creative-project-36/", date: "2026-05-18" },
  { number: 37, title: "AI Bot Spammer Detective", desc: "Visualize AI bot spam patterns on GitHub — detect, analyze, and explore spammer networks.", tags: ["ai-agent", "security"], url: "https://mavisy75106.github.io/creative-project-37/", date: "2026-05-19" },
  { number: 38, title: "Morph: CLI-Anything Visualizer", desc: "Interactive visualization of how software interfaces dissolve into agent-executable commands.", tags: ["ai-agent", "cli"], url: "https://mavisy75106.github.io/creative-project-38/", date: "2026-05-19" },
  { number: 39, title: "AI Watermark Explorer", desc: "Visualize AI-generated image watermarks across different models and detection modes.", tags: ["visualization", "ai-agent"], url: "https://mavisy75106.github.io/creative-project-42/", date: "2026-05-20" },
  { number: 40, title: "AI Agent Protocol Stack Visualizer", desc: "4 visualization modes: Network, Protocol Layers, Packet Flow, Encryption — explore how AI agents communicate.", tags: ["ai-agent", "visualization"], url: "https://mavisy75106.github.io/creative-project-44/", date: "2026-05-21" },
  { number: 41, title: "CLAUDE.md Prompt Architect", desc: "Karpathy's 4 Rules for Claude Code — interactive visualization with live accuracy demo and particle network.", tags: ["ai-agent", "cli"], url: "https://mavisy75106.github.io/creative-project-45/", date: "2026-05-21" },
  { number: 42, title: "AI Prompt Benchmark", desc: "Compare CLAUDE.md configurations — live leaderboard with simulated benchmark scores and pairwise comparison.", tags: ["ai-agent", "visualization"], url: "https://mavisy75106.github.io/creative-project-46/", date: "2026-05-21" },
  { number: 43, title: "CLAUDE.md Template Gallery", desc: "8 pre-built CLAUDE.md templates with interactive builder, search, filter, and quality scoring.", tags: ["ai-agent", "cli"], url: "https://mavisy75106.github.io/creative-project-47/", date: "2026-05-21" },
  { number: 44, title: "Prompt Quality Analyzer", desc: "Score AI responses against Karpathy's 4 Rules — visual score rings with improvement suggestions.", tags: ["ai-agent", "visualization"], url: "https://mavisy75106.github.io/creative-project-48/", date: "2026-05-21" },
  { number: 45, title: "AI Agent Memory Visualizer", desc: "Flow visualization of MEMORY.md entries — timeline and network views with search and confidence indicators.", tags: ["ai-agent", "visualization"], url: "https://mavisy75106.github.io/creative-project-49/", date: "2026-05-21" },
  { number: 46, title: "Geometry Proof Visualizer", desc: "OpenAI model's counterexample to a central discrete geometry conjecture — 3-mode interactive proof animation.", tags: ["visualization", "creative"], url: "https://mavisy75106.github.io/creative-project-50/", date: "2026-05-21" },
  { number: 47, title: "Code Graph Explorer", desc: "3D code knowledge graph with force-directed layout, animated particles, search, and complexity slider.", tags: ["visualization", "ai-agent"], url: "https://mavisy75106.github.io/creative-project-53/", date: "2026-05-22" },
  { number: 48, title: "VSCode Extension Breach Attack Chain", desc: "Visualize the VSCode extension supply chain attack — phase-based node-link with data stream particles.", tags: ["security", "visualization"], url: "https://mavisy75106.github.io/creative-project-52/", date: "2026-05-21" },
  { number: 49, title: "AI Writing Transformer", desc: "AI writing style transformation visualizer — see how tone, structure, and voice shift between styles.", tags: ["ai-agent", "visualization"], url: "https://mavisy75106.github.io/creative-project-54/", date: "2026-05-22" },
  { number: 50, title: "AI Coding Agent War Room", desc: "Multi-agent codebase visualization — watch parallel agents plan, code, review, and deploy.", tags: ["ai-agent", "visualization"], url: "https://mavisy75106.github.io/creative-project-56/", date: "2026-05-22" },
  { number: 51, title: "AI Agent Workflow Orchestrator", desc: "Real-time 4-agent pipeline visualization — Planner→Coder→Reviewer→Deployer with thought streams and burst mode.", tags: ["ai-agent", "visualization"], url: "https://mavisy75106.github.io/creative-project-57/", date: "2026-05-23" },
  { number: 52, title: "Flipper One — Wireless World Scanner", desc: "Interactive radar sweep, oscilloscope waveforms, and spectrum analysis for RFID/NFC/BLE/WiFi/IR signals.", tags: ["visualization", "creative"], url: "https://mavisy75106.github.io/creative-project-55/", date: "2026-05-22" },
  { number: 53, title: "OpenSCAD 3D Architectural LLM Visualizer", desc: "Text-prompted architectural generation — keyword classification, seeded PRNG, 14 element types with Canvas renderer.", tags: ["visualization", "creative"], url: "https://Mavisy75106.github.io/creative-project-58/", date: "2026-05-23" },
  { number: 54, title: "80386 Microcode Visualizer", desc: "x86 instruction decoding and pipeline exploration — see how microcode executes at the silicon level.", tags: ["visualization", "cli"], url: "https://mavisy75106.github.io/creative-project-59/", date: "2026-05-24" },
  { number: 55, title: "SpaceX Starship v3 Launch Visualizer", desc: "10-phase launch visualization with particle exhaust, re-entry plasma, stage separation burst, and HUD telemetry.", tags: ["space", "visualization"], url: "https://mavisy75106.github.io/creative-project-60/", date: "2026-05-24" },
  { number: 56, title: "DeepSeek Reasonix Visualizer", desc: "Native coding agent with cache visualization — see reasoning chains, token usage, and cache hit/miss patterns.", tags: ["ai-agent", "visualization"], url: "https://Mavisy75106.github.io/creative-project-61/", date: "2026-05-25" },
  { number: 57, title: "Boring Languages + LLM Pipeline", desc: "Language/tool pipeline comparison with per-entity particle shapes, progress rings, and CRT aesthetic.", tags: ["visualization", "ai-agent"], url: "https://mavisy75106.github.io/creative-project-62/", date: "2026-05-27" },
  { number: 58, title: "Code Knowledge Graph — Understand Anything", desc: "2D code knowledge graph with cross-cluster edges, particle flow, search rings, and connection detail panel.", tags: ["visualization", "ai-agent"], url: "https://mavisy75106.github.io/creative-project-63/", date: "2026-05-27" },
  { number: 59, title: "Taste-Skill AI Slop Detector", desc: "Visual AI content quality analyzer — detect and visualize 'slop' patterns in AI-generated content.", tags: ["ai-agent", "visualization"], url: "https://mavisy75106.github.io/creative-project-64/", date: "2026-05-27" },
  { number: 60, title: "MMA Tank Monitor", desc: "275m³ methyl methacrylate storage tank visualizer — the 'tank that ate a highway' with interactive controls.", tags: ["visualization", "creative"], url: "https://mavisy75106.github.io/creative-project-65-mma-tank-monitor/", date: "2026-05-28" },
 { number: 64, title: "SimCity 3K in 4K Data Compression Visualizer", desc: "5 visualization modes: Full Resolution View, Compression Detail, Block Grid, Pixel Analysis, and Difference View. Explore how 4K data transforms into 3K compressed format.", tags: ["visualization", "creative"], url: "https://Mavisy75106.github.io/creative-project-64/", date: "2026-05-28" },
  { number: 72, title: "Before AI Explorer", desc: "Interactive timeline visualizer — type any prompt and watch it transform from 2019's authentic internet through the AI-saturated 2026 with particle systems, taste meters, and era-specific aesthetics.", tags: ["visualization", "creative", "ai"], url: "https://Mavisy75106.github.io/before-ai-explorer/", date: "2026-05-30" },
  { number: 73, title: "Dead Economy Visualizer", desc: "Multi-mode Canvas visualization of a dead economy: liquidity trap, currency debasement, shadow market, and capital flight — driven by real-world macro indicators.", tags: ["visualization", "creative"], url: "https://Mavisy75106.github.io/creative-project-73-dead-economy/", date: "2026-05-30" },
  { number: 73, title: "MoE Architecture Explorer", desc: "Interactive LLM MoE architecture visualization with routing, activation, and throughput comparison", tags: ["visualization", "ai-agent"], url: "https://Mavisy75106.github.io/moe-architecture-explorer/", date: "2026-05-30" },
  { number: 75, title: "1-Bit Bonsai — Image Quantization Lab", desc: "Explore how 1-bit quantization compresses 4B parameter image models to ~0.93GB — side-by-side full precision vs quantized canvas, real-time PSNR/SSIM metrics, per-channel bit-level visualization, and denoising diffusion simulation.", tags: ["visualization", "creative"], url: "https://Mavisy75106.github.io/creative-project-75/", date: "2026-06-01" },
];

// Re-tag for filter matching
projects.forEach(p => {
  p.category = p.tags[0];
});

const filters = ['all', 'ai-agent', 'visualization', 'cli', 'security', 'space', 'creative'];
const filterLabels = {
  all: 'All', 'ai-agent': 'AI Agent', 'visualization': 'Visualization',
  'cli': 'CLI / Tool', 'security': 'Security', 'space': 'Space', 'creative': 'Creative'
};

function renderGrid(filtered) {
  const grid = document.getElementById('grid-view');
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><h3>No projects found</h3><p>Try a different search or filter.</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map(p => `
    <div class="project-card" data-num="${p.number}">
      <div class="project-number">PROJECT #${p.number}</div>
      <div class="project-title">${p.title}</div>
      <div class="project-desc">${p.desc}</div>
      <div class="project-tags">${p.tags.map(t => `<span class="tag">${filterLabels[t] || t}</span>`).join('')}</div>
      <a href="${p.url}" target="_blank" class="project-link" onclick="event.stopPropagation()">Launch Project →</a>
    </div>
  `).join('');

  grid.querySelectorAll('.project-card').forEach(card => {
    card.addEventListener('click', () => openModal(card.dataset.num));
  });
}

function renderTimeline(filtered) {
  const tl = document.getElementById('timeline-view');
  const sorted = [...filtered].sort((a, b) => b.number - a.number);
  tl.innerHTML = sorted.map(p => `
    <div class="timeline-item" data-num="${p.number}">
      <div class="timeline-date">${p.date}</div>
      <div class="timeline-content">
        <div class="timeline-title">${p.title}</div>
        <div class="timeline-meta">
          <a href="${p.url}" target="_blank" style="color: var(--accent); text-decoration: none;">View Project</a>
          &nbsp;·&nbsp;
          ${p.tags.map(t => `<span class="tag">${t}</span>`).join(' ')}
        </div>
      </div>
    </div>
  `).join('');

  tl.querySelectorAll('.timeline-item').forEach(item => {
    item.addEventListener('click', () => openModal(item.dataset.num));
  });
}

function openModal(num) {
  const p = projects.find(x => x.number == num);
  if (!p) return;
  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <div class="modal-num">PROJECT #${p.number}</div>
    <h2>${p.title}</h2>
    <div class="modal-desc">${p.desc}</div>
    <div class="project-tags" style="margin-bottom: 1.5rem;">${p.tags.map(t => `<span class="tag">${filterLabels[t] || t}</span>`).join('')}</div>
    <div class="modal-actions">
      <a href="${p.url}" target="_blank" class="btn-launch primary">Launch →</a>
      <a href="https://github.com/Mavisy75106/creative-project-${p.number}" target="_blank" class="btn-launch secondary">Source Code</a>
    </div>
  `;
  document.getElementById('modal').classList.add('active');
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const active = document.querySelector('.filter-btn.active')?.dataset.filter || 'all';
  let filtered = projects;
  if (active !== 'all') {
    filtered = projects.filter(p => p.tags.includes(active));
  }
  if (q) {
    filtered = filtered.filter(p =>
      p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.number.toString().includes(q)
    );
  }
  return filtered;
}

// Init
renderGrid(projects);
renderTimeline(projects);
document.getElementById('total-count').textContent = projects.length;
document.getElementById('deployed-count').textContent = projects.length;
const cats = new Set(projects.flatMap(p => p.tags));
document.getElementById('categories-count').textContent = cats.size;

// Search & filter
document.getElementById('search').addEventListener('input', () => {
  const f = getFiltered();
  renderGrid(f);
  renderTimeline(f);
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = getFiltered();
    renderGrid(f);
    renderTimeline(f);
  });
});

// View toggle
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const v = btn.dataset.view;
    document.getElementById('grid-view').classList.toggle('hidden', v === 'timeline');
    document.getElementById('timeline-view').classList.toggle('active', v === 'timeline');
  });
});

// Modal
document.getElementById('modal-close').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('active');
});
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('active');
});

// Background particles
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let w, h;
function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);

const particles = [];
for (let i = 0; i < 40; i++) {
  particles.push({
    x: Math.random() * w, y: Math.random() * h,
    vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
    r: Math.random() * 1.5 + 0.5, a: Math.random() * 0.3 + 0.05
  });
}

function animateBg() {
  ctx.clearRect(0, 0, w, h);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
    if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(108, 99, 255, ${p.a})`;
    ctx.fill();
  });
  requestAnimationFrame(animateBg);
}
animateBg();
</script>
</body>
</html>
